<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      width: 1024px;
      height: 1024px;
      overflow: hidden;
    }
    svg { display: block; }
  </style>
</head>
<body>
  <svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#27272b"/>
        <stop offset="100%" stop-color="#0a0a0c"/>
      </linearGradient>
      <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#c8c8cd"/>
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="18" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

    <rect x="60" y="60" width="904" height="904" rx="180" ry="180" fill="none"
          stroke="rgba(255,255,255,0.05)" stroke-width="2"/>

    <g fill="url(#bar)" filter="url(#glow)">
      <rect x="257" y="442" width="70" height="140" rx="35"/>
      <rect x="367" y="372" width="70" height="280" rx="35"/>
      <rect x="477" y="302" width="70" height="420" rx="35"/>
      <rect x="587" y="372" width="70" height="280" rx="35"/>
      <rect x="697" y="442" width="70" height="140" rx="35"/>
    </g>
  </svg>
</body>
</html>
