<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Listen K</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="titlebar">
    <div class="brand">Listen K</div>
    <div class="status" id="status">대기</div>
  </header>

  <main>
    <section class="card">
      <div class="card-head">
        <h2>설정 상태</h2>
        <button id="refreshBtn" class="ghost" title="상태 새로고침">새로고침</button>
      </div>
      <div id="checkList" class="check-list"></div>
    </section>

    <section class="card">
      <h2>사용법</h2>
      <div class="usage">
        <div class="usage-row">
          <span class="usage-step">1</span>
          텍스트를 입력하고 싶은 곳에 커서를 둡니다
        </div>
        <div class="usage-row">
          <span class="usage-step">2</span>
          <kbd id="hotkeyHint">단축키</kbd> 을 한 번 눌러 녹음을 시작합니다 (하단에 HUD 표시)
        </div>
        <div class="usage-row">
          <span class="usage-step">3</span>
          말을 마치면 <kbd id="hotkeyHint">단축키</kbd> 또는 HUD 의 <span class="icon-check">✓</span> 로 확정
        </div>
        <div class="usage-row">
          <span class="usage-step">4</span>
          정제된 텍스트가 자동으로 포커스된 필드에 붙여넣어집니다
        </div>
        <div class="usage-row" style="color: var(--text-3);">
          취소는 HUD 의 <span class="icon-x">✕</span> · 대체 단축키 <kbd>⌘</kbd><kbd>⇧</kbd><kbd>Space</kbd>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>환경설정</h2>
      <div class="settings">
        <label>
          단축키
          <select id="hotkey">
            <option value="rshift-double">Right ⇧ 두 번 탭 (권장)</option>
            <option value="ropt-double">Right ⌥ 두 번 탭</option>
            <option value="rctl-double">Right ⌃ 두 번 탭</option>
            <option value="rcmd-double">Right ⌘ 두 번 탭</option>
            <option value="fn">fn (Globe 키)</option>
          </select>
        </label>
        <label>
          언어
          <select id="lang">
            <option value="ko-KR" selected>한국어</option>
            <option value="en-US">English (US)</option>
            <option value="ja-JP">日本語</option>
          </select>
        </label>
        <label>
          실시간 표시
          <select id="streaming">
            <option value="on" selected>켜짐 (말하는 동안 HUD 표시)</option>
            <option value="off">꺼짐 (녹음 완료 후 일괄 변환)</option>
          </select>
        </label>
        <label>
          후처리
          <select id="mode">
            <option value="rules" selected>규칙 기반 (필러 제거)</option>
            <option value="off">끄기 (Whisper 원문)</option>
            <option value="ollama">Ollama</option>
          </select>
        </label>
        <label>
          Ollama 모델
          <input id="model" type="text" value="gemma3:4b" />
        </label>
        <label>
          톤 (Ollama용)
          <select id="tone">
            <option value="neutral" selected>자연스럽게</option>
            <option value="formal">격식체</option>
            <option value="casual">캐주얼</option>
            <option value="email">이메일</option>
          </select>
        </label>
      </div>
    </section>

    <section class="card" id="recentCard" hidden>
      <div class="card-head">
        <h2>최근 전사</h2>
        <button id="copyBtn" class="ghost">복사</button>
      </div>
      <div id="raw" class="output raw" contenteditable="true" spellcheck="false"></div>
      <div id="clean" class="output clean"></div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="renderer.js"></script>
</body>
</html>
