name: Release

# Triggered by pushing a version tag (e.g. v0.4.0). Builds a Developer ID
# signed, notarised DMG and attaches it to the matching GitHub Release.
#
# Required repository secrets (set in Settings → Secrets and variables →
# Actions → Repository secrets) before this workflow can succeed:
#
#   MAC_CERTIFICATE_BASE64        - Developer ID Application cert (.p12),
#                                   base64-encoded. Generate with:
#                                     base64 -i DeveloperID.p12 | pbcopy
#   MAC_CERTIFICATE_PASSWORD      - Password used when exporting the .p12
#   APPLE_ID                      - Apple ID email for notarytool
#   APPLE_APP_SPECIFIC_PASSWORD   - App-specific password from appleid.apple.com
#   APPLE_TEAM_ID                 - 10-character team ID from developer.apple.com
#
# Also: remove (or flip) `mac.identity: null` in package.json before the first
# real release — it is currently `null` for local ad-hoc builds.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # WhisperKit's transitive swift-jinja >= 2.0 requires tools 6.0
          # (Xcode 16+). macos-14 ships Xcode 15 by default, so pin to the
          # latest stable Xcode on whatever runner image GitHub selects.
          xcode-version: latest-stable

      - name: Install deps
        run: npm ci

      - name: Build Swift helpers
        run: |
          npm run build:helper
          npm run build:transcribe

      - name: Download bundled Whisper model (base only)
        # v0.7.0 moved turbo / accurate / small to in-app download so the
        # signed bundle stays small. Only the ~150 MB base model ships
        # as the always-available fallback that Apple Speech → WhisperKit
        # can fall back on without internet.
        run: npm run model:whisperkit:base

      - name: Verify signing secrets are present
        run: |
          test -n "${{ secrets.MAC_CERTIFICATE_BASE64 }}"    || (echo "::error::MAC_CERTIFICATE_BASE64 not set" && exit 1)
          test -n "${{ secrets.MAC_CERTIFICATE_PASSWORD }}"  || (echo "::error::MAC_CERTIFICATE_PASSWORD not set" && exit 1)
          test -n "${{ secrets.APPLE_ID }}"                   || (echo "::error::APPLE_ID not set" && exit 1)
          test -n "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" || (echo "::error::APPLE_APP_SPECIFIC_PASSWORD not set" && exit 1)
          test -n "${{ secrets.APPLE_TEAM_ID }}"              || (echo "::error::APPLE_TEAM_ID not set" && exit 1)

      - name: Build, sign, notarise, and publish DMG + ZIP
        env:
          # electron-builder reads these directly. CSC_* triggers Developer ID
          # signing; APPLE_* triggers notarisation via @electron/notarize.
          # `--publish always` tells electron-builder to create the GitHub
          # Release (as a draft per package.json `mac.publish.releaseType`),
          # upload every artifact, and — critically for auto-update —
          # upload `latest-mac.yml` so electron-updater clients can see the
          # new version.
          #
          # We emit BOTH dmg and zip. The DMG is the user-facing download
          # (drag into /Applications), the ZIP is what Squirrel.Mac —
          # electron-updater's macOS backend — actually consumes. Omitting
          # the zip makes auto-update throw ERR_UPDATER_ZIP_FILE_NOT_FOUND
          # and silently give up (regression present in v0.6.0–v0.7.1).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac dmg zip --publish always

      - name: Compute checksum and attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          shasum -a 256 ListenK-*.dmg ListenK-*.zip > SHA256SUMS
          TAG="${GITHUB_REF#refs/tags/}"
          # electron-builder already created the draft release in the
          # previous step; just append the checksum file.
          gh release upload "$TAG" SHA256SUMS --clobber
