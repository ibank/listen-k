name: Feature request
description: Suggest a new feature or behaviour change
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Listen K is a focused solo project — we
        will be honest if something is out of scope rather than leave it
        open indefinitely. See
        [CONTRIBUTING.md](https://github.com/ibank/ListenK/blob/main/CONTRIBUTING.md#what-is-in-scope-what-is-not)
        for the scope summary.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the underlying need, not a specific solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What would the feature do? Mock UI or example flow welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: audience
    attributes:
      label: Who benefits?
      multiple: true
      options:
        - Individual power users
        - Writers / bloggers
        - Developers
        - Translators
        - Teams / businesses
        - Everyone
    validations:
      required: true
